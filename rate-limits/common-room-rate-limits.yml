webhooks:
  description: >-
    Webhook deliveries are triggered by workflow rules. No explicit delivery-rate
    limit is documented; realtime workflows fire on event occurrence and the
    "contacts that meet criteria" workflow runs once daily.
  secret:
    header: x-commonroom-webhook-secret
    description: Optional shared secret sent in the webhook request header for payload verification
  detail: asyncapi/common-room-webhooks.yml
