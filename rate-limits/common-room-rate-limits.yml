pagination_pressure:
  note: >-
    v2 list operations cap `limit` at 200 (default 50), so a full-workspace crawl
    of a 750k-contact Enterprise room is at minimum 3,750 requests. Budget for
    429s on any bulk read.
  detail: conventions/common-room-conventions.yml
authentication:
  type: Bearer Token
  description: >-
    API tokens are created in Settings > API Tokens and used as JWT Bearer tokens
    in the Authorization header. Limits are enforced per token, so issuing a
    separate token per workload isolates their budgets.
  header: Authorization
  format: 'Bearer <token>'
  tokenStatusEndpoint: 'GET /api-token-status'
