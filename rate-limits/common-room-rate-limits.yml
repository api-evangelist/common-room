name: Common Room API Rate Limits
description: >-
  Rate limits for the Common Room Core (v1), v2 and SCIM APIs. Common Room does not
  publish a numeric threshold anywhere, but it DOES publish a complete runtime
  signal — four response headers plus a structured 429 body that tells a client
  exactly how long to wait. For an agent that is the more useful contract.
url: https://api.commonroom.io/docs/api-v2.html
limit_count: 0
limit_count_note: >-
  Zero PUBLISHED numeric limits. No requests-per-second, per-minute or per-day
  figure appears in the docs or the specs; the ceiling is enforced per API token
  and varies by plan tier. This is an honest zero, not an unchecked field — the
  runtime signal below is fully documented and machine-readable.
scope: per-api-token
status_code: 429
headers:
- name: X-RateLimit-Limit
  description: The total amount of requests permitted within the interval
  type: integer
  on: every response
  source: openapi components.headers
- name: X-RateLimit-Remaining
  description: The total amount of requests remaining within the interval
  type: integer
  on: every response
  source: openapi components.headers
- name: X-RateLimit-Reset
  description: The datetime in epoch seconds when the interval resets
  type: integer
  on: 429
  source: openapi components.responses.RateLimited
- name: Retry-After
  description: The UTC datetime when the interval resets
  type: string
  format: date-time
  on: 429
  source: openapi components.responses.RateLimited
  note: >-
    NON-STANDARD VALUE. RFC 9110 Retry-After carries either delta-seconds or an
    HTTP-date; Common Room declares it as an ISO 8601 date-time. A client using an
    off-the-shelf Retry-After parser may fail to read it — prefer
    rateLimit.waitMs from the body.
response_body:
  media_type: application/json
  fields:
  - {name: reason, type: string}
  - {name: rateLimit.intervalLimit, type: number, description: The total amount of requests permitted within the interval}
  - {name: rateLimit.intervalRemaining, type: number, description: The amount of requests remaining within the interval}
  - {name: rateLimit.intervalResetSeconds, type: number, description: The amount of time in seconds representing a single interval}
  - {name: rateLimit.waitMs, type: number, description: The amount of time to wait until the next interval}
  agent_guidance: >-
    On 429, sleep rateLimit.waitMs and retry. All reads are safe to retry; contact
    and organization creates are natural-key upserts and are also safe. Activity
    and note creates are NOT — they append.
