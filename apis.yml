name: Common Room
description: Common Room is an AI-native go-to-market and buyer-intelligence platform
  that unifies first-party product, community, social, web and CRM signals into a
  single identity-resolved view of contacts and organizations. It exposes a v1 Core
  REST API for ingesting contacts and activity from your own sources, a v2 REST API
  for reading contacts, organizations, activities, segments, lead scores, custom
  objects, website visits and Prospector data, a SCIM 2.0 API for provisioning, a
  webhook surface driven by workflow rules, a hosted OAuth 2.1 MCP server at
  mcp.commonroom.io for AI clients, and a first-party `cr` CLI for scripted and
  agent-driven access.
