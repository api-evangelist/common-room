note: >-
  Common Room ships no npm-distributed UI element library. What it does ship is a
  set of client-side and embedded surfaces that a customer installs into somewhere
  they already work — a JS tracker in their own site, a browser extension, a
  widget inside Salesforce, and a plugin inside Claude. Grouped by family below.
families:
- family: web-tracker
  name: Common Room web tracking snippet
  kind: client-side-javascript
  docs: https://www.commonroom.io/docs/signals/website-visitor-tracking/
  availability: all plans
  distribution: workspace-unique snippet copied from Settings -> Signals and integrations -> Website visits
  registry: none
  version: null
  version_note: >-
    The snippet is generated per workspace and is not published to npm or a
    versioned CDN path, so a consumer cannot pin or inspect a version. Recorded as
    null deliberately — checked, nothing to record.
  install_methods:
  - method: direct
    detail: Paste the snippet inside the <body> tag
  - method: google-tag-manager
    detail: Custom HTML tag, All Pages trigger
  - method: react-next-gatsby
    detail: Inject into a high-level layout component via dangerouslySetInnerHTML, avoiding duplicate <script> tags
  global: window.signals
  api:
  - call: 'window.signals.identify({ email: userEmail })'
    description: >-
      Associates an anonymous visit with a known identity. Common Room states this
      raises deanonymization rates by over 50%. Standard email/name form fields
      are de-anonymized automatically.
  partner: >-
    Enhanced US visitor tracking rewrites the snippet to use identification
    technology from Vector.
